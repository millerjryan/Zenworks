[core]
plugins = alpha animate autostart blur command decoration expo fast-switcher foreign-toplevel grid gtk-shell idle ipc ipc-rules move place resize session-lock shortcuts-inhibit simple-tile vswitch window-rules wm-actions xdg-activation
vwidth = 5
vheight = 1
close_top_view = <super> KEY_Q | <alt> KEY_F4
preferred_decoration_mode = client

[autostart]
autostart_wf_shell = false
zenworks = zen-wayfire --shell

[input]
xkb_layout = us
click_method = clickfinger
tap_to_click = true

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[simple-tile]
tile_by_default = !(app_id is "kitty" | (app_id is "org.quickshell" & !(title is "terminus" | title is "plato")))
key_toggle = <super> KEY_F
key_focus_left = <super> KEY_LEFT
key_focus_right = <super> KEY_RIGHT
key_focus_above = <super> KEY_UP
key_focus_below = <super> KEY_DOWN
key_toggle_maximized = <super> KEY_M
inner_gap_size = 4
outer_horiz_gap_size = 8
outer_vert_gap_size = 8

[grid]
slot_l = <super> <ctrl> KEY_LEFT
slot_r = <super> <ctrl> KEY_RIGHT
slot_c = <super> KEY_Z
restore = <super> <ctrl> KEY_DOWN

[wm-actions]
toggle_fullscreen = <super> <shift> KEY_F
toggle_sticky = <super> <shift> KEY_S

[fast-switcher]
activate = <super> KEY_TAB
activate_backward = <super> <shift> KEY_TAB

[expo]
toggle = <super> KEY_GRAVE

[vswitch]
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
with_win_1 = <super> <shift> KEY_1
with_win_2 = <super> <shift> KEY_2
with_win_3 = <super> <shift> KEY_3
with_win_4 = <super> <shift> KEY_4
with_win_5 = <super> <shift> KEY_5

[idle]
screensaver_timeout = -1
dpms_timeout = -1

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = kitty
binding_browser = <super> KEY_B
command_browser = xdg-open about:blank
binding_launcher = <super> KEY_SPACE
command_launcher = qs ipc call Cynosure toggle
binding_selection = <super> <shift> KEY_SPACE
command_selection = qs ipc call Cynosure selection
binding_files = <super> KEY_E
command_files = qs ipc call Terminus spawn ''
binding_keys = <super> KEY_SLASH
command_keys = qs ipc call Keys toggle
binding_notes = <super> KEY_O
command_notes = qs ipc call Clio open
binding_monitor = <super> KEY_K
command_monitor = qs ipc call Zeus toggle
binding_viewer = <super> <shift> KEY_B
command_viewer = qs ipc call Picasso toggle
binding_passwords = <super> <shift> KEY_V
command_passwords = qs ipc call Calypso window
binding_store = <super> KEY_P
command_store = qs ipc call Ceres toggleWindow store
binding_updates = <super> <shift> KEY_P
command_updates = qs ipc call Ceres toggleWindow updates
binding_settings = <super> KEY_COMMA
command_settings = qs ipc call Oracle toggle
binding_lock = <super> KEY_ESC
command_lock = qs ipc call Cerberus lock
binding_screenshot = KEY_SYSRQ
command_screenshot = qs ipc call Picasso shot screen
binding_region = <super> <shift> KEY_SYSRQ
command_region = qs ipc call Picasso shot region
binding_window = <super> KEY_SYSRQ
command_window = qs ipc call Picasso shot window
binding_picker = <super> <ctrl> KEY_P
command_picker = qs ipc call Picasso pick
binding_record = <super> KEY_R
command_record = zen-wayfire --record screen
binding_record_region = <super> <ctrl> KEY_R
command_record_region = zen-wayfire --record region
binding_record_window = <super> <shift> KEY_R
command_record_window = zen-wayfire --record window
binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binding_mic = KEY_MICMUTE
command_mic = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = brightnessctl set +5%
binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = brightnessctl set 5%-
binding_play = KEY_PLAYPAUSE
command_play = playerctl play-pause
binding_next = KEY_NEXTSONG
command_next = playerctl next
binding_previous = KEY_PREVIOUSSONG
command_previous = playerctl previous
